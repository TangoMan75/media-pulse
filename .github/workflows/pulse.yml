name: Media Pulse

on:
  schedule:
    - cron: "0 0 9 * *"
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write  # needed for git push

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run scraper
        run: npm run scrape

      - name: Build SVGs
        run: npm run build

      - name: Show changes (debug)
        run: |
          echo "=== Changes in docs/ ==="
          git status --porcelain docs/
          git diff --cached --name-only docs/ || true

      - name: Commit and push
        run: |
          git add docs/
          
          if git diff --cached --quiet; then
            echo "✅ No changes to commit (data is still fresh or SVGs unchanged)"
          else
            git config --local user.email "github-actions[bot]@users.noreply.github.com"
            git config --local user.name "github-actions[bot]"
            git commit -m "chore: monthly update of media traffic assets [skip ci]"
            git push
            echo "✅ Changes committed and pushed successfully"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}